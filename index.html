<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet Panel SAP</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #111927;
      --border: #1e2d4a;
      --text: #e2e8f0;
      --accent: #00f0ff;
      --accent-hover: #00b8cc;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .copy-btn {
      background: var(--accent);
      color: #050811;
      border: none;
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .copy-btn.copied {
      background: var(--success);
      color: #ffffff;
    }

    .code-box {
      width: 100%;
      height: 200px;
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: #94a3b8;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      outline: none;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .instructions {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">Bookmarklet SAP (Texto Puro)</h1>
      <button class="copy-btn" id="btnCopy" onclick="copyScript()">
        📋 Copiar Código
      </button>
    </div>

    <p class="instructions">
      <strong>Problema resolvido:</strong> O código na caixa de texto agora é 100% texto puro e não será mais renderizado como elementos visuais pelo navegador.
    </p>
  </div>

  <script>
    function copyScript() {
      const codeBox = document.getElementById('codeBlock');
      codeBox.select();
      
      navigator.clipboard.writeText(codeBox.value).then(() => {
        const btn = document.getElementById('btnCopy');
        btn.classList.add('copied');
        btn.innerHTML = '✓ Copiado com Sucesso!';
        
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '📋 Copiar Código';
        }, 2000);
      });
    }
  </script>
</body>
</html>
