<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet - Automação SAP EWM (Híbrido)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #64748b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .action-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      font-weight: 700;
      font-size: 0.9rem;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-preview {
      background: #1e293b;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-copy {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .btn-copy.copied {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      resize: none;
      outline: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Painel Automação SAP</h1>
    <p>Testador e gerador de bookmarklet para navegação no celular/desktop.</p>

    <div class="action-area">
      <!-- BOTÃO DE TESTE DIRETO NO CELULAR -->
      <button id="preview-btn" class="btn btn-preview">
        👁️ Visualizar / Testar Design no Celular
      </button>

      <button id="copy-btn" class="btn btn-copy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copiar Bookmarklet Híbrido
      </button>

      <textarea id="code-box" readonly></textarea>
    </div>
  </div>

  <script>
    const codeJs = "if(document.getElementById('p-sap'))return;var t1,t2,n1='',n2='',fx=!1,cL=0,iAP=!1,isP=!1,tI=300,lH=null,st=document.createElement('style');st.innerHTML='#p-sap{position:fixed;top:60px;right:15px;z-index:999999;background:#0f172a;color:#f8fafc;padding:8px;border-radius:10px;font-family:sans-serif;width:160px;box-shadow:0 8px 20px #000;display:flex;flex-direction:column;gap:6px;cursor:move;user-select:none}#p-sap *{box-sizing:border-box}#p-sap input,#p-sap select{background:#1e293b;border:1px solid #334155;color:#f8fafc;border-radius:4px;text-align:center;font-size:10px;outline:0;height:24px;width:100%}#p-sap .hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;padding-bottom:4px}#p-sap .ttl{font-weight:700;color:#38bdf8;font-size:10px}#p-sap .st-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}#p-sap .lbl{color:#94a3b8;font-size:8px;font-weight:700;display:block;margin-bottom:2px}#p-sap .m-lst{display:none;position:absolute;top:38px;left:0;width:100%;background:#1e293b;border:1px solid #334155;border-radius:4px;max-height:120px;overflow-y:auto;z-index:1000000}#p-sap .opt{padding:4px;cursor:pointer;border-bottom:1px solid #0f172a;text-align:center;font-size:10px}#p-sap .opt:hover{background:#334155;color:#38bdf8}#p-sap .ctrl-grid{display:grid;grid-template-columns:1fr 28px 1fr 28px;gap:4px;align-items:center}#p-sap .cnt-box{background:#1e293b;border:1px solid #334155;border-radius:4px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#22c55e}#p-sap .btn-c{border:none;color:#fff;border-radius:4px;height:28px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}#p-sap select.tm-sel{height:28px;background:#1e293b;border:1px solid #334155;color:#38bdf8;font-weight:700;font-size:10px}';document.head.appendChild(st);var a=document.createElement('div');a.id='p-sap';a.innerHTML='<div class=\"hdr\"><span class=\"ttl\">ENDEREÇAMENTO</span><span id=\"s-st\" class=\"st-badge\">ONLINE</span></div><div style=\"position:relative\"><span class=\"lbl\">FAIXA DESTINO</span><div style=\"display:flex;gap:3px;height:24px\"><input id=\"s-fx\" type=\"text\" placeholder=\"Escolha...\" style=\"font-weight:700;flex-grow:1\"><button id=\"s-btn\" style=\"width:22px;height:24px;background:#1e293b;border:1px solid #334155;color:#38bdf8;border-radius:4px;cursor:pointer\">▼</button></div><div id=\"sap-menu-list\" class=\"m-lst\"><div class=\"opt\">001-01-090</div><div class=\"opt\">001-01-011</div><div class=\"opt\">001-01-012</div><div class=\"opt\">LOBO</div><div class=\"opt\">STAGE1</div><div class=\"opt\">STAGE2</div><div class=\"opt\">STAGE3</div></div></div><div><span class=\"lbl\">FILTRAR MATERIAL</span><input id=\"s-mat\" type=\"text\" placeholder=\"Todos\"></div><div class=\"ctrl-grid\"><div class=\"cnt-box\"><span id=\"s-cnt\">00</span></div><button id=\"s-rz\" class=\"btn-c\" style=\"background:#ef4444\" title=\"Zerar\">X</button><select id=\"s-tm\" class=\"tm-sel\" title=\"Intervalo\"><option value=\"300\">0.3s</option><option value=\"500\">0.5s</option><option value=\"1000\">1.0s</option></select><button id=\"s-ps\" class=\"btn-c\" style=\"background:#0284c7\" title=\"Pausar\">||</button></div>';document.body.appendChild(a);var selInput=a.querySelector('#s-fx'),matFiltroInput=a.querySelector('#s-mat'),menuBtn=a.querySelector('#s-btn'),menuList=a.querySelector('#sap-menu-list'),stBadge=a.querySelector('#s-st'),psBtn=a.querySelector('#s-ps'),tmSel=a.querySelector('#s-tm'),isOpen=!1;menuBtn.onclick=function(e){e.stopPropagation();isOpen=!isOpen;menuList.style.display=isOpen?'block':'none'};document.addEventListener('click',function(e){if(!a.contains(e.target)){isOpen=!1;menuList.style.display='none'}});a.querySelectorAll('.opt').forEach(function(o){o.onclick=function(e){e.stopPropagation();selInput.value=e.target.innerText.trim();isOpen=!1;menuList.style.display='none';selInput.dispatchEvent(new Event('input',{bubbles:!0}))}});function updateCnt(v){cL+=v;a.querySelector('#s-cnt').innerText=cL<10?'0'+cL:cL}a.querySelector('#s-rz').onclick=function(){cL=0;a.querySelector('#s-cnt').innerText='00'};psBtn.onclick=function(){isP=!isP;if(isP){stBadge.innerText='PAUSA';stBadge.style.background='rgba(234,179,8,.15)';stBadge.style.color='#eab308';psBtn.innerText='>';psBtn.style.background='#eab308'}else{stBadge.innerText='ONLINE';stBadge.style.background='rgba(34,197,94,.15)';stBadge.style.color='#22c55e';psBtn.innerText='||';psBtn.style.background='#0284c7'}};tmSel.onchange=function(){tI=parseInt(tmSel.value,10)};var isD=!1,sX,sY,iL,iT,stD=function(e){if(['s-fx','s-btn','s-mat','s-rz','s-ps','s-tm'].includes(e.target.id)||e.target.closest('.btn-c')||e.target.classList.contains('opt'))return;isD=!0;var c=e.touches?e.touches[0]:e;sX=c.clientX;sY=c.clientY;var r=a.getBoundingClientRect();iL=r.left;iT=r.top},doD=function(e){if(!isD)return;var c=e.touches?e.touches[0]:e;a.style.left=(iL+c.clientX-sX)+'px';a.style.top=(iT+c.clientY-sY)+'px';a.style.right='auto'},enD=function(){isD=!1};a.addEventListener('mousedown',stD);document.addEventListener('mousemove',doD);document.addEventListener('mouseup',enD);a.addEventListener('touchstart',stD,{passive:!0});document.addEventListener('touchmove',doD,{passive:!0});document.addEventListener('touchend',enD);";

    const bookmarkletCode = "javascript:(function(){" + codeJs + "})();";

    document.getElementById('code-box').value = bookmarkletCode;

    // Executa a interface diretamente na tela do celular para teste visual
    document.getElementById('preview-btn').addEventListener('click', () => {
      new Function(codeJs)();
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bookmarkletCode);
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.classList.add('copied');
        copyBtn.innerText = 'Copiado!';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = `Copiar Bookmarklet Híbrido`;
        }, 2000);
      } catch (err) {
        document.getElementById('code-box').select();
        document.execCommand('copy');
      }
    });
  </script>
</body>
</html>
