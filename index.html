<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet - Automação SAP EWM Pro (Com Senha)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b0f19;
      --border: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(14, 165, 233, 0.05);
    }

    h1 {
      font-size: 1.25rem;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    p {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .action-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-preview {
      background: rgba(30, 41, 59, 0.6);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-preview:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-copy {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
    }

    .btn-copy.copied {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 12px;
      resize: none;
      outline: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Automação SAP EWM (Protegido)</h1>
    <p>Interface com autenticação por senha offline via Hash SHA-256 nativo do navegador.</p>

    <div class="action-area">
      <button id="preview-btn" class="btn btn-preview">
        <span>🔒</span> Testar Execução do Robô
      </button>

      <button id="copy-btn" class="btn btn-copy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copiar Bookmarklet Seguro
      </button>

      <textarea id="code-box" readonly></textarea>
    </div>
  </div>

  <script>
    // A SENHA ATUAL DEFINIDA É: 1234
    // Para alterar a senha, você deve gerar o hash SHA-256 da nova palavra e substituir o valor de HASH_CORRETO.
    
    const codeJs = "if(document.getElementById('p-sap'))return;var HASH_CORRETO='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';async function sha256(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}var inputSenha=prompt('Acesso Restrito: Digite a senha para liberar o robô EWM:');if(!inputSenha)return;sha256(inputSenha).then(function(hashIngressado){if(hashIngressado!==HASH_CORRETO){alert('Senha incorreta! Acesso negado.');return;}iniciarRobo();});function iniciarRobo(){var t1,t2,n1='',n2='',fx=!1,cL=0,iAP=!1,isP=!1,tI=300,lH=null,st=document.createElement('style'),fnt=document.createElement('link');fnt.rel='stylesheet';fnt.href='https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@800&display=swap';document.head.appendChild(fnt);st.innerHTML='#p-sap{position:fixed;top:60px;right:15px;z-index:999999;background:rgba(11,15,25,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#f8fafc;padding:12px;border-radius:16px;font-family:\"Inter\",system-ui,sans-serif;width:176px;box-shadow:0 20px 40px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.08),inset 0 1px 0 rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:10px;cursor:move;user-select:none}#p-sap *{box-sizing:border-box}#p-sap input,#p-sap select{background:#030712;border:1px solid rgba(255,255,255,0.1);color:#f8fafc;border-radius:8px;text-align:center;font-size:11px;font-weight:600;outline:0;height:28px;width:100%;transition:all .2s ease}#p-sap input:focus,#p-sap select:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,0.25)}#p-sap .hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:2px}#p-sap .ttl{font-weight:700;color:#f8fafc;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;display:flex;align-items:center;gap:5px}#p-sap .ttl::before{content:\"\";display:inline-block;width:6px;height:6px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8}#p-sap .st-badge{font-size:8px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.3);letter-spacing:0.5px}#p-sap .lbl{color:#64748b;font-size:8px;font-weight:700;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}#p-sap .m-lst{display:none;position:absolute;top:44px;left:0;width:100%;background:#090d16;border:1px solid rgba(255,255,255,0.1);border-radius:8px;max-height:120px;overflow-y:auto;z-index:1000000;box-shadow:0 10px 25px rgba(0,0,0,0.8)}#p-sap .opt{padding:6px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);text-align:center;font-size:10px;color:#cbd5e1;font-weight:500}#p-sap .opt:hover{background:rgba(56,189,248,0.15);color:#38bdf8}#p-sap .ctrl-grid{display:grid;grid-template-columns:1fr 28px 1fr 28px;gap:5px;align-items:center}#p-sap .cnt-box{background:#020617;border:1px solid rgba(255,255,255,0.08);border-radius:8px;height:32px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,0.8)}#p-sap .cnt-txt{font-family:\"JetBrains Mono\",monospace;font-size:16px;font-weight:800;color:#10b981;text-shadow:0 0 10px rgba(16,185,129,0.5);letter-spacing:0.5px}#p-sap .btn-c{border:none;color:#fff;border-radius:8px;height:32px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:11px;transition:all .15s ease}#p-sap .btn-c:active{transform:scale(0.94)}#p-sap select.tm-sel{height:32px;background:#030712;border:1px solid rgba(255,255,255,0.1);color:#38bdf8;font-weight:700;font-size:10px;border-radius:8px}';document.head.appendChild(st);var a=document.createElement('div');a.id='p-sap';a.innerHTML='<div class=\"hdr\"><span class=\"ttl\">EWM ROBÔ</span><span id=\"s-st\" class=\"st-badge\">ONLINE</span></div><div style=\"position:relative\"><span class=\"lbl\">FAIXA DESTINO</span><div style=\"display:flex;gap:4px;height:28px\"><input id=\"s-fx\" type=\"text\" placeholder=\"Escolha...\" style=\"flex-grow:1\"><button id=\"s-btn\" style=\"width:28px;height:28px;background:#030712;border:1px solid rgba(255,255,255,0.1);color:#38bdf8;border-radius:8px;cursor:pointer;font-size:9px\">▼</button></div><div id=\"sap-menu-list\" class=\"m-lst\"><div class=\"opt\">001-01-090</div><div class=\"opt\">001-01-011</div><div class=\"opt\">001-01-012</div><div class=\"opt\">LOBO</div><div class=\"opt\">STAGE1</div><div class=\"opt\">STAGE2</div><div class=\"opt\">STAGE3</div></div></div><div><span class=\"lbl\">FILTRAR MATERIAL</span><input id=\"s-mat\" type=\"text\" placeholder=\"Todos\"></div><div class=\"ctrl-grid\"><div class=\"cnt-box\"><span id=\"s-cnt\" class=\"cnt-txt\">00</span></div><button id=\"s-rz\" class=\"btn-c\" style=\"background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3)\" title=\"Zerar\">X</button><select id=\"s-tm\" class=\"tm-sel\" title=\"Intervalo\"><option value=\"300\">0.3s</option><option value=\"500\">0.5s</option><option value=\"1000\">1.0s</option></select><button id=\"s-ps\" class=\"btn-c\" style=\"background:rgba(14,165,233,0.2);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)\" title=\"Pausar\">||</button></div>';document.body.appendChild(a);var selInput=a.querySelector('#s-fx'),matFiltroInput=a.querySelector('#s-mat'),menuBtn=a.querySelector('#s-btn'),menuList=a.querySelector('#sap-menu-list'),stBadge=a.querySelector('#s-st'),psBtn=a.querySelector('#s-ps'),tmSel=a.querySelector('#s-tm'),isOpen=!1;menuBtn.onclick=function(e){e.stopPropagation();isOpen=!isOpen;menuList.style.display=isOpen?'block':'none'};document.addEventListener('click',function(e){if(!a.contains(e.target)){isOpen=!1;menuList.style.display='none'}});a.querySelectorAll('.opt').forEach(function(o){o.onclick=function(e){e.stopPropagation();selInput.value=e.target.innerText.trim();isOpen=!1;menuList.style.display='none';selInput.dispatchEvent(new Event('input',{bubbles:!0}))}});function updateCnt(v){cL+=v;a.querySelector('#s-cnt').innerText=cL<10?'0'+cL:cL}a.querySelector('#s-rz').onclick=function(){cL=0;a.querySelector('#s-cnt').innerText='00'};psBtn.onclick=function(){isP=!isP;if(isP){stBadge.innerText='PAUSA';stBadge.style.background='rgba(234,179,8,0.12)';stBadge.style.color='#facc15';stBadge.style.borderColor='rgba(234,179,8,0.3)';psBtn.innerText='>';psBtn.style.background='rgba(234,179,8,0.2)';psBtn.style.color='#facc15';psBtn.style.borderColor='rgba(234,179,8,0.3)'}else{stBadge.innerText='ONLINE';stBadge.style.background='rgba(16,185,129,0.12)';stBadge.style.color='#34d399';stBadge.style.borderColor='rgba(16,185,129,0.3)';psBtn.innerText='||';psBtn.style.background='rgba(14,165,233,0.2)';psBtn.style.color='#38bdf8';psBtn.style.borderColor='rgba(56,189,248,0.3)'}};tmSel.onchange=function(){tI=parseInt(tmSel.value,10)};var isD=!1,sX,sY,iL,iT,stD=function(e){if(['s-fx','s-btn','s-mat','s-rz','s-ps','s-tm'].includes(e.target.id)||e.target.closest('.btn-c')||e.target.classList.contains('opt'))return;isD=!0;var c=e.touches?e.touches[0]:e;sX=c.clientX;sY=c.clientY;var r=a.getBoundingClientRect();iL=r.left;iT=r.top},doD=function(e){if(!isD)return;var c=e.touches?e.touches[0]:e;a.style.left=(iL+c.clientX-sX)+'px';a.style.top=(iT+c.clientY-sY)+'px';a.style.right='auto'},enD=function(){isD=!1};a.addEventListener('mousedown',stD);document.addEventListener('mousemove',doD);document.addEventListener('mouseup',enD);a.addEventListener('touchstart',stD,{passive:!0});document.addEventListener('touchmove',doD,{passive:!0});document.addEventListener('touchend',enD);}";

    const bookmarkletCode = "javascript:(function(){" + codeJs + "})();";

    document.getElementById('code-box').value = bookmarkletCode;

    // Testar direto na página
    document.getElementById('preview-btn').addEventListener('click', () => {
      new Function(codeJs)();
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bookmarkletCode);
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.classList.add('copied');
        copyBtn.innerText = 'Copiado com Sucesso!';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copiar Bookmarklet Seguro
          `;
        }, 2000);
      } catch (err) {
        document.getElementById('code-box').select();
        document.execCommand('copy');
      }
    });
  </script>
</body>
</html>
