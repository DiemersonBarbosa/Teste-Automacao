<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Automação SAP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background-color: #f5f6f8; color: #24272a; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-box { max-width: 400px; width: 100%; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e5e9; text-align: center; }
        .login-box h2 { color: #1d2d3e; margin-bottom: 20px; font-size: 20px; }
        .input-grupo { text-align: left; margin-bottom: 15px; }
        .input-grupo label { display: block; font-size: 12px; color: #515456; margin-bottom: 5px; font-weight: bold; }
        .input-grupo input { width: 100%; padding: 10px; border: 1px solid #abb9c7; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .input-grupo input:focus { border-color: #0070d2; outline: none; }
        .btn-login { background: #1d2d3e; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-login:hover { background: #2c3e50; }
        .erro-msg { color: #ee5253; font-size: 12px; margin-top: 10px; display: none; font-weight: bold; }
        .container { max-width: 750px; width: 100%; background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); text-align: center; border: 1px solid #e2e5e9; display: none; }
        h1 { color: #1d2d3e; font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        p { color: #515456; margin-bottom: 25px; font-size: 14px; }
        .btn-copiar { background: #0070d2; color: white; border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: background 0.2s ease; margin-bottom: 20px; }
        .btn-copiar:hover { background: #0056a3; }
        .area-codigo { width: 100%; height: 250px; background-color: #1a2733; color: #abb9c7; font-family: 'Courier New', Courier, monospace; font-size: 13px; padding: 15px; border-radius: 8px; border: 1px solid #293b4c; resize: none; box-sizing: border-box; line-height: 1.5; overflow-x: auto; white-space: pre; }
        .instrucoes { text-align: left; background: #f8fafb; padding: 18px; border-radius: 8px; margin-top: 25px; font-size: 13px; border-left: 4px solid #0070d2; color: #32363a; }
    </style>
</head>
<body>

    <!-- CAIXA DE LOGIN -->
    <div class="login-box" id="caixa-login">
        <h2>Controle de Acesso Klabin</h2>
        <div class="input-grupo">
            <label>Usuário:</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>
        <div class="input-grupo">
            <label>Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>
        <button class="btn-login" onclick="autenticar()">Entrar no Painel</button>
        <div class="erro-msg" id="erro">Acesso negado!</div>
    </div>

    <!-- PAINEL DO ROBÔ (TEXTAREA VAZIA QUE SERÁ PREENCHIDA VIA LINK EXTERNO) -->
    <div class="container" id="painel-principal">
        <h1>Painel de Automação SAP - Klabin</h1>
        <p>Acesso autorizado. Clique no botão azul abaixo para obter o script com limpeza profunda de blocos.</p>
        <button class="btn-copiar" onclick="copiarCodigo()">Copiar Código de Automação</button>
        <textarea class="area-codigo" id="script-sap" readonly placeholder="Carregando script seguro da nuvem..."></textarea>
        <div class="instrucoes">
            <strong>Procedimento:</strong>
            <ol style="margin-top: 8px; padding-left: 20px; line-height: 1.6;">
                <li>Copie o script utilizando o botão azul.</li>
                <li>Injete o código no console (F12) do SAP.</li>
            </ol>
        </div>
    </div>

    <script>
        // LINK SEGURO DO SCRIPT HOSPEDADO NA NUVEM (Livre de cortes do chat)
        var urlMetodoNativo = "https://githubusercontent.com";

        function autenticar() {
            var usuarioDigitado = document.getElementById("usuario").value.trim();
            var senhaDigitada = document.getElementById("senha").value.trim();
            var msgErro = document.getElementById("erro");
            
            // Credenciais mascaradas: admin / klabin123
            if (btoa(usuarioDigitado) === "YWRtaW4=" && btoa(senhaDigitada) === "a2xhYmluMTIz") {
                
                // Busca o robô completo na nuvem de forma instantânea em segundo plano
                fetch(urlMetodoNativo)
                    .then(response => response.text())
                    .then(codigoRobo => {
                        // Preenche a caixa de texto e libera o painel na tela
                        document.getElementById("script-sap").value = codigoRobo;
                        document.getElementById("caixa-login").style.style.display = "none";
                        document.getElementById("painel-principal").style.display = "block";
                    })
                    .catch(err => {
                        alert("Erro ao conectar ao servidor de automação. Verifique sua conexão com a internet.");
                    });

            } else {
                msgErro.style.display = "block";
                setTimeout(function() { msgErro.style.display = "none"; }, 3000);
            }
        }

        document.getElementById("senha").addEventListener("keyup", function(event) {
            if (event.key === "Enter") { autenticar(); }
        });

        function copiarCodigo() {
            var campoTexto = document.getElementById("script-sap");
            campoTexto.select();
            campoTexto.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                var btn = document.querySelector(".btn-copiar");
                btn.innerText = "Script Copiado com Sucesso!";
                btn.style.background = "#2b7c2b";
                setTimeout(function() {
                    btn.innerText = "Copiar Código de Automação";
                    btn.style.background = "#0070d2";
                }, 2500);
            } catch (err) {
                alert("Falha ao copiar automaticamente.");
            }
        }
    </script>

</body>
</html>
