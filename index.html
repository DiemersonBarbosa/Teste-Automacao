<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarklet - Automação SAP EWM (Design Digital)</title>
  <!-- Fonte Digital embutida via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0f172a;
      --border: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #64748b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .action-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-preview {
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .btn-preview:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .btn-copy {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .btn-copy.copied {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      resize: none;
      outline: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Automação SAP EWM</h1>
    <p>Interface futurista e contador digital em LED estilo HUD.</p>

    <div class="action-area">
      <!-- BOTÃO DE TESTE DIRETO NO CELULAR -->
      <button id="preview-btn" class="btn btn-preview">
        ⚡ Visualizar Design Futurista no Celular
      </button>

      <button id="copy-btn" class="btn btn-copy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copiar Bookmarklet
      </button>

      <textarea id="code-box" readonly></textarea>
    </div>
  </div>

  <script>
    // Script com estilização moderna: Fonte digital Orbitron, Display LED com efeito Glassmorphism e Glow Neon
    const codeJs = "if(document.getElementById('p-sap'))return;var t1,t2,n1='',n2='',fx=!1,cL=0,iAP=!1,isP=!1,tI=300,lH=null,st=document.createElement('style'),fnt=document.createElement('link');fnt.rel='stylesheet';fnt.href='https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap';document.head.appendChild(fnt);st.innerHTML='#p-sap{position:fixed;top:60px;right:15px;z-index:999999;background:rgba(15,23,42,0.92);backdrop-filter:blur(12px);color:#f8fafc;padding:10px;border-radius:14px;font-family:system-ui,sans-serif;width:170px;box-shadow:0 10px 30px rgba(0,0,0,0.8),0 0 1px 1px rgba(56,189,248,0.3);display:flex;flex-direction:column;gap:8px;cursor:move;user-select:none;border:1px solid rgba(255,255,255,0.08)}#p-sap *{box-sizing:border-box}#p-sap input,#p-sap select{background:#020617;border:1px solid #334155;color:#f8fafc;border-radius:6px;text-align:center;font-size:10px;outline:0;height:26px;width:100%;transition:all .2s}#p-sap input:focus,#p-sap select:focus{border-color:#38bdf8;box-shadow:0 0 6px rgba(56,189,248,0.4)}#p-sap .hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:5px}#p-sap .ttl{font-weight:900;color:#38bdf8;font-size:10px;letter-spacing:1px;text-transform:uppercase}#p-sap .st-badge{font-size:8px;font-weight:800;padding:2px 6px;border-radius:20px;background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.4);box-shadow:0 0 8px rgba(74,222,128,0.2)}#p-sap .lbl{color:#64748b;font-size:8px;font-weight:700;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}#p-sap .m-lst{display:none;position:absolute;top:40px;left:0;width:100%;background:#090d16;border:1px solid #334155;border-radius:6px;max-height:120px;overflow-y:auto;z-index:1000000;box-shadow:0 10px 20px #000}#p-sap .opt{padding:6px;cursor:pointer;border-bottom:1px solid #1e293b;text-align:center;font-size:10px;color:#cbd5e1}#p-sap .opt:hover{background:#1e293b;color:#38bdf8}#p-sap .ctrl-grid{display:grid;grid-template-columns:1fr 28px 1fr 28px;gap:5px;align-items:center}#p-sap .cnt-box{background:#000;border:1px solid #1e293b;border-radius:6px;height:32px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,0.9)}#p-sap .cnt-txt{font-family:\"Orbitron\",monospace;font-size:17px;font-weight:900;color:#22c55e;text-shadow:0 0 8px rgba(34,197,94,0.8),0 0 15px rgba(34,197,94,0.4);letter-spacing:1px}#p-sap .btn-c{border:none;color:#fff;border-radius:6px;height:32px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:11px;transition:transform .1s,background .2s}#p-sap .btn-c:active{transform:scale(0.95)}#p-sap select.tm-sel{height:32px;background:#020617;border:1px solid #334155;color:#38bdf8;font-weight:700;font-size:10px;border-radius:6px}';document.head.appendChild(st);var a=document.createElement('div');a.id='p-sap';a.innerHTML='<div class=\"hdr\"><span class=\"ttl\">EWM ROBÔ</span><span id=\"s-st\" class=\"st-badge\">ONLINE</span></div><div style=\"position:relative\"><span class=\"lbl\">FAIXA DESTINO</span><div style=\"display:flex;gap:3px;height:26px\"><input id=\"s-fx\" type=\"text\" placeholder=\"Escolha...\" style=\"font-weight:700;flex-grow:1\"><button id=\"s-btn\" style=\"width:24px;height:26px;background:#020617;border:1px solid #334155;color:#38bdf8;border-radius:6px;cursor:pointer\">▼</button></div><div id=\"sap-menu-list\" class=\"m-lst\"><div class=\"opt\">001-01-090</div><div class=\"opt\">001-01-011</div><div class=\"opt\">001-01-012</div><div class=\"opt\">LOBO</div><div class=\"opt\">STAGE1</div><div class=\"opt\">STAGE2</div><div class=\"opt\">STAGE3</div></div></div><div><span class=\"lbl\">FILTRAR MATERIAL</span><input id=\"s-mat\" type=\"text\" placeholder=\"Todos\"></div><div class=\"ctrl-grid\"><div class=\"cnt-box\"><span id=\"s-cnt\" class=\"cnt-txt\">00</span></div><button id=\"s-rz\" class=\"btn-c\" style=\"background:linear-gradient(135deg,#ef4444,#b91c1c)\" title=\"Zerar\">X</button><select id=\"s-tm\" class=\"tm-sel\" title=\"Intervalo\"><option value=\"300\">0.3s</option><option value=\"500\">0.5s</option><option value=\"1000\">1.0s</option></select><button id=\"s-ps\" class=\"btn-c\" style=\"background:linear-gradient(135deg,#0284c7,#0369a1)\" title=\"Pausar\">||</button></div>';document.body.appendChild(a);var selInput=a.querySelector('#s-fx'),matFiltroInput=a.querySelector('#s-mat'),menuBtn=a.querySelector('#s-btn'),menuList=a.querySelector('#sap-menu-list'),stBadge=a.querySelector('#s-st'),psBtn=a.querySelector('#s-ps'),tmSel=a.querySelector('#s-tm'),isOpen=!1;menuBtn.onclick=function(e){e.stopPropagation();isOpen=!isOpen;menuList.style.display=isOpen?'block':'none'};document.addEventListener('click',function(e){if(!a.contains(e.target)){isOpen=!1;menuList.style.display='none'}});a.querySelectorAll('.opt').forEach(function(o){o.onclick=function(e){e.stopPropagation();selInput.value=e.target.innerText.trim();isOpen=!1;menuList.style.display='none';selInput.dispatchEvent(new Event('input',{bubbles:!0}))}});function updateCnt(v){cL+=v;a.querySelector('#s-cnt').innerText=cL<10?'0'+cL:cL}a.querySelector('#s-rz').onclick=function(){cL=0;a.querySelector('#s-cnt').innerText='00'};psBtn.onclick=function(){isP=!isP;if(isP){stBadge.innerText='PAUSA';stBadge.style.background='rgba(234,179,8,0.15)';stBadge.style.color='#facc15';stBadge.style.borderColor='rgba(250,204,21,0.4)';psBtn.innerText='>';psBtn.style.background='linear-gradient(135deg,#eab308,#ca8a04)'}else{stBadge.innerText='ONLINE';stBadge.style.background='rgba(34,197,94,0.15)';stBadge.style.color='#4ade80';stBadge.style.borderColor='rgba(74,222,128,0.4)';psBtn.innerText='||';psBtn.style.background='linear-gradient(135deg,#0284c7,#0369a1)'}};tmSel.onchange=function(){tI=parseInt(tmSel.value,10)};var isD=!1,sX,sY,iL,iT,stD=function(e){if(['s-fx','s-btn','s-mat','s-rz','s-ps','s-tm'].includes(e.target.id)||e.target.closest('.btn-c')||e.target.classList.contains('opt'))return;isD=!0;var c=e.touches?e.touches[0]:e;sX=c.clientX;sY=c.clientY;var r=a.getBoundingClientRect();iL=r.left;iT=r.top},doD=function(e){if(!isD)return;var c=e.touches?e.touches[0]:e;a.style.left=(iL+c.clientX-sX)+'px';a.style.top=(iT+c.clientY-sY)+'px';a.style.right='auto'},enD=function(){isD=!1};a.addEventListener('mousedown',stD);document.addEventListener('mousemove',doD);document.addEventListener('mouseup',enD);a.addEventListener('touchstart',stD,{passive:!0});document.addEventListener('touchmove',doD,{passive:!0});document.addEventListener('touchend',enD);";

    const bookmarkletCode = "javascript:(function(){" + codeJs + "})();";

    document.getElementById('code-box').value = bookmarkletCode;

    // Executa a interface diretamente na tela para teste visual
    document.getElementById('preview-btn').addEventListener('click', () => {
      new Function(codeJs)();
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bookmarkletCode);
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.classList.add('copied');
        copyBtn.innerText = 'Copiado!';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = `Copiar Bookmarklet`;
        }, 2000);
      } catch (err) {
        document.getElementById('code-box').select();
        document.execCommand('copy');
      }
    });
  </script>
</body>
</html>
