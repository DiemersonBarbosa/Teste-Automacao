<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Instalador</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:30px;text-align:center;">
    <h3>Instalador do Robô Invisível v24.0</h3>
    <button id="bt" style="padding:10px 20px;cursor:pointer;font-weight:bold;" onclick="cp()">Copiar Script do Robô</button>
    <script>
    function cp() {
        var c = "javascript:(function(){let e=false,n='';function i(t){t.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));t.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}setInterval(function(){if(!e){const o=document.querySelector('[id$=\"LoteInput2-inner\"]');if(o){const a=o.value.trim();if(a!=''&&a!='Relative'&&a!=n){n=a;e=true;setTimeout(function(){const b=document.querySelector('[id$=\"nextButton-BDI-content\"]');if(b){i(b);setTimeout(function(){const c=document.querySelector('[id$=\"_IDGenButton2-BDI-content\"]');if(c){i(c);setTimeout(function(){n='';e=false},1500)}},500)}else{e=false;n=''}},3000)}else if(a==''){n='';e=false;}}}},300);})();";
        var t = document.createElement("textarea"); t.value = c; document.body.appendChild(t); t.select();
        document.execCommand("copy"); document.getElementById("bt").innerText = "SCRIPT COPIADO!"; document.body.removeChild(t);
    }
    </script>
</body>
</html>
