<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Instalador do Robô Invisível v18.2</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:Arial,sans-serif;padding:30px;text-align:center;">
    <div style="background:#1e293b;max-width:400px;margin:20px auto;padding:20px;border-radius:8px;border:1px solid #334155;">
        <h3 style="color:#38bdf8;margin-top:0;">Painel de Instalação v18.2</h3>
        <p style="color:#94a3b8;font-size:13px;">Clique no botão abaixo para copiar o Script Invisível de 3 segundos aprovado para o SAP Real.</p>
        <button id="bt" style="background:#0070d2;color:#fff;border:none;padding:12px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px;width:100%;margin:15px 0;" onclick="cp()">Copiar Script do Robô</button>
        <div style="text-align:left;background:#0f172a;padding:10px;border-radius:4px;font-size:12px;color:#cbd5e1;border-left:4px solid #38bdf8;">
            <strong>📌 Como atualizar no Edge/Tablet:</strong>
            <ol style="margin:5px 0 0 0;padding-left:15px;line-height:1.4;">
                <li>Clique no botão azul acima para copiar o código.</li>
                <li>Abra as propriedades do favorito no Edge, apague a URL antiga e dê <strong>Ctrl + V</strong>.</li>
            </ol>
        </div>
    </div>
    <script>
    function cp() {
        // Script purificado sem elementos visuais para burlar o bloqueio de segurança CSP do SAP real
        var script = "javascript:(function(){let e=false,n='';const o='[id$=\"_IDGenButton2-BDI-content\"]';function i(t){t.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));t.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}function s(){const t=document.querySelector(o);if(t){i(t);setTimeout(()=>{n='';e=false},1500)}else{setTimeout(s,300)}}setInterval((function(){const lL=document.querySelector('.sapMList, .sapMTable, [id*=\"faixasDisponiveis\"], .sapMSplitContainerMaster');if(lL){lL.style.setProperty('display','none','important');const t=lL.closest('.sapMVBox, .sapMHBox, .sapMFlexBox');if(t)t.style.setProperty('display','none','important')}if(!e){const oInput2=document.querySelector('[id$=\"LoteInput2-inner\"]');if(oInput2){const a=oInput2.value.trim();if(a!=='Relative'&&a!==n){n=a;e=true;setTimeout((function(){const t=document.querySelector('[id$=\"LoteInput2-inner\"]');if(!t||t.value.trim()===''){e=false;n='';return}oInput2.dispatchEvent(new Event('change',{bubbles:true}));const bNext=document.querySelector('[id$=\"nextButton-BDI-content\"]');if(bNext){i(bNext);s()}else{e=false}}),3000)}else if(a===''){n='';e=false;}}}}),300);})();";
        
        var tArea = document.createElement("textarea"); 
        tArea.value = script; 
        document.body.appendChild(tArea); 
        tArea.select();
        try {
            document.execCommand("copy"); 
            var b = document.getElementById("bt"); 
            b.innerText = "Script Copiado!"; 
            b.style.background = "#16a34a";
            setTimeout(function() { 
                b.innerText = "Copiar Script do Robô"; 
                b.style.background = "#0070d2" 
            }, 2500);
        } catch (err) { 
            alert("Erro ao copiar automaticamente."); 
        }
        document.body.removeChild(tArea);
    }
    </script>
</body>
</html>
