<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Acessos SAP</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #111927;
      --border: #1e2d4a;
      --text: #e2e8f0;
      --accent: #00f0ff;
      --accent-hover: #00b8cc;
      --success: #10b981;
      --danger: #ff2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* Tela de Login */
    #admin-login-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .input-field {
      background: #050811;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-weight: bold;
      width: 100%;
      text-align: center;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .btn-action {
      background: var(--accent);
      color: #050811;
      border: none;
      padding: 11px;
      font-size: 0.88rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-action:hover { background: var(--accent-hover); }

    .error-msg {
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: bold;
      display: none;
    }

    /* Painel Principal */
    #admin-dashboard {
      display: none;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: bold;
    }

    select {
      background: #050811;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-weight: bold;
      width: 100%;
    }

    .pin-card {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      margin: 14px 0;
      text-align: center;
    }

    .pin-title {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pin-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 5px;
      margin-top: 2px;
    }

    .btn-copy.copied { background: var(--success); color: #fff; }

    /* Seção de Cadastro de Usuários */
    .section-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
    }

    .section-title {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .user-list {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #050811;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .btn-del {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TELA DE LOGIN DO ADMIN -->
    <div id="admin-login-screen">
      <h1 class="title">🔐 Acesso Restrito Admin</h1>
      <p style="font-size: 0.78rem; color: #94a3b8;">Digite a senha mestre para acessar:</p>
      <input type="password" id="admin-pass-input" class="input-field" placeholder="••••••••" onkeydown="if(event.key==='Enter') verifyAdminLogin()">
      <div id="login-err" class="error-msg">SENHA INCORRETA</div>
      <button class="btn-action" onclick="verifyAdminLogin()">Entrar no Painel</button>
    </div>

    <!-- PAINEL DE GESTÃO DE ACESSOS -->
    <div id="admin-dashboard">
      <h1 class="title">Gestão de Acessos SAP</h1>

      <div class="form-group">
        <label for="userSelect">Selecione o Usuário:</label>
        <select id="userSelect" onchange="updateUserPIN()"></select>
      </div>

      <div class="pin-card">
        <div class="pin-title">PIN Válido Hoje para este Usuário:</div>
        <div class="pin-value" id="userPin">...</div>
      </div>

      <button class="btn-action btn-copy" id="btnCopy" onclick="copyUserBookmarklet()">
        📋 Copiar Bookmarklet do Usuário
      </button>

      <!-- SEÇÃO PARA CADASTRAR NOVOS USUÁRIOS -->
      <div class="section-box">
        <div class="section-title">➕ Cadastrar Novo Usuário</div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <input type="text" id="new-user-name" class="input-field" placeholder="Nome do Funcionário" style="text-align: left; font-size: 0.8rem;">
          <button class="btn-action" style="width: 80px; padding: 6px;" onclick="addUser()">Criar</button>
        </div>

        <div class="section-title" style="margin-top: 12px;">👥 Usuários Cadastrados</div>
        <div class="user-list" id="userListContainer"></div>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PASS_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"; // admin123
    const MASTER_KEY = 'SISTEMA_SAP_MASTER_OFFLINE_KEY';

    // Lista padrão inicial caso o banco local esteja vazio
    const defaultUsers = [
      { name: "João Silva", id: "JOAO", secret: "SALT_JOAO_8812" },
      { name: "Maria Santos", id: "MARIA", secret: "SALT_MARIA_4421" }
    ];

    function getUsers() {
      const saved = localStorage.getItem('sap_users_db');
      return saved ? JSON.parse(saved) : defaultUsers;
    }

    function saveUsers(users) {
      localStorage.setItem('sap_users_db', JSON.stringify(users));
    }

    async function hashString(str) {
      const buffer = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyAdminLogin() {
      const inputPass = document.getElementById('admin-pass-input').value;
      const inputHash = await hashString(inputPass);
      
      if (inputHash === ADMIN_PASS_HASH) {
        document.getElementById('admin-login-screen').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';
        renderUserDropdown();
        renderUserList();
      } else {
        document.getElementById('login-err').style.display = 'block';
        document.getElementById('admin-pass-input').value = '';
        document.getElementById('admin-pass-input').focus();
      }
    }

    function renderUserDropdown() {
      const users = getUsers();
      const select = document.getElementById('userSelect');
      select.innerHTML = '';

      if (users.length === 0) {
        select.innerHTML = '<option value="">Nenhum usuário cadastrado</option>';
        document.getElementById('userPin').innerText = '----';
        return;
      }

      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.dataset.secret = u.secret;
        opt.dataset.name = u.name;
        opt.innerText = u.name;
        select.appendChild(opt);
      });

      updateUserPIN();
    }

    function renderUserList() {
      const users = getUsers();
      const container = document.getElementById('userListContainer');
      container.innerHTML = '';

      users.forEach((u, index) => {
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `
          <span><strong>${u.name}</strong> (${u.id})</span>
          <button class="btn-del" onclick="removeUser(${index})">Excluir</button>
        `;
        container.appendChild(item);
      });
    }

    function addUser() {
      const nameInput = document.getElementById('new-user-name');
      const name = nameInput.value.trim();

      if (!name) return alert('Digite o nome do usuário.');

      const users = getUsers();
      const id = name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) + '_' + Math.floor(100 + Math.random() * 900);
      const secret = 'SALT_' + id + '_' + Date.now();

      users.push({ name, id, secret });
      saveUsers(users);

      nameInput.value = '';
      renderUserDropdown();
      renderUserList();
    }

    function removeUser(index) {
      if (!confirm('Deseja realmente remover este usuário?')) return;
      const users = getUsers();
      users.splice(index, 1);
      saveUsers(users);
      renderUserDropdown();
      renderUserList();
    }

    async function getUserPin(username, userSecret) {
      const today = new Date().toISOString().slice(0, 10);
      const combinedKey = today + username + userSecret + MASTER_KEY;
      const buffer = new TextEncoder().encode(combinedKey);
      const hash = await crypto.subtle.digest('SHA-256', buffer);
      const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
      return parseInt(hex.slice(-6), 16).toString().slice(-4).padStart(4, '0');
    }

    async function updateUserPIN() {
      const select = document.getElementById('userSelect');
      if (!select.value) return;
      const username = select.value;
      const secret = select.options[select.selectedIndex].dataset.secret;
      const pin = await getUserPin(username, secret);
      document.getElementById('userPin').innerText = pin;
    }

      navigator.clipboard.writeText(bookmarkletCode).then(() => {
        const btn = document.getElementById('btnCopy');
        btn.classList.add('copied');
        btn.innerHTML = `✓ Copiado para ${displayName}!`;

        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '📋 Copiar Bookmarklet do Usuário';
        }, 2000);
      });
    }
  </script>
</body>
</html>
